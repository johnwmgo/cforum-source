name: Mirror to public source repo

# Keeps johnwmgo/cforum-source in sync with main so the modified source
# is publicly available, as required by the AGPL-3.0 (see /about).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    if: github.repository == 'johnwmgo/cforum'
    runs-on: ubuntu-latest
    name: Push main to public mirror
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to mirror
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git push --force git@github.com:johnwmgo/cforum-source.git HEAD:refs/heads/main
          git push --force git@github.com:johnwmgo/cforum-source.git --tags
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
